apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  namespace: ivolve

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs-app

  template:
    metadata:
      labels:
        app: nodejs-app

    spec:
      tolerations:
      - key: "node"
        operator: "Equal"
        value: "worker"
        effect: "NoSchedule"

      
      containers:
      - name: nodejs-app
        image: momen007/ivolve-nodejs-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef:
            name: mysql-config

        - secretRef:
            name: mysql-secret

        volumeMounts:
        - name: app-logs
          mountPath: /app/logs

      volumes:
      - name: app-logs
        persistentVolumeClaim:
          claimName: app-logs-pvc
